name: Windows build and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: src/PresencePlus.Matter/package-lock.json
      - name: Restore and check Matter helper
        working-directory: src/PresencePlus.Matter
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Windows UI, settings, and process protocol
        shell: pwsh
        run: dotnet run --project .\tests\PresencePlus.Checks -c Release -- --node (Get-Command node).Source
      - name: Check read-only tablet viewer
        shell: pwsh
        run: node --test .\tests\PresencePlus.Checks\tablet-display.test.mjs
      - name: Create portable package
        id: package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { (Get-Content -LiteralPath .\VERSION -Raw).Trim() }
          .\scripts\Package.ps1 -Version $version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Verify the extracted download
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath .\artifacts\packages -Filter *.zip -File | Select-Object -First 1
          $expected = (Get-Content -LiteralPath ($archive.FullName + '.sha256') -Raw).Split(' ')[0]
          if ((Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash -ine $expected) { throw 'Checksum mismatch.' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath .\artifacts\extracted
          if ((Get-ChildItem -LiteralPath .\artifacts\extracted -Recurse -File | Measure-Object).Count -gt 100) { throw 'File-count budget exceeded.' }
          & .\artifacts\extracted\Matter\node.exe .\src\PresencePlus.Matter\check-bundle.mjs .\artifacts\extracted\Matter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Start-Process -FilePath .\artifacts\extracted\PresencePlus.exe -ArgumentList '--check-package' -PassThru -RedirectStandardOutput .\artifacts\extracted-runtime-check.txt
          if (-not $app.WaitForExit(30000)) { Stop-Process -Id $app.Id; throw 'Windows runtime check timed out.' }
          if ($app.ExitCode -ne 0 -or (Get-Content -LiteralPath .\artifacts\extracted-runtime-check.txt -Raw).Trim() -ne 'PresencePlus Windows runtime loaded.') { throw 'Windows runtime check failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: PresencePlus-win-x64
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.sha256
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: windows-latest
    concurrency:
      group: release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PresencePlus-win-x64
          path: release
      - name: Publish GitHub download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $published = @(& gh api --paginate "repos/$env:GH_REPO/releases" --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing GitHub releases.' }
          if ($published -contains $tag) {
            Write-Output "Release $tag already exists; leaving its tag and assets unchanged."
            exit 0
          }
          $releaseArgs = @('release', 'create', $tag, '.\release\*.zip', '.\release\*.sha256',
            '--title', "PresencePlus $tag", '--generate-notes')
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $releaseArgs += '--verify-tag'
          } else {
            $refs = & gh api "repos/$env:GH_REPO/git/matching-refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Could not check the release tag.' }
            if (($refs | ConvertFrom-Json).ref -contains "refs/tags/$tag") {
              throw "Tag $tag already exists without a release. Run the tag workflow instead of changing its target."
            }
            $releaseArgs += @('--target', $env:GITHUB_SHA)
          }
          if ($env:RELEASE_VERSION.Contains('-')) { $releaseArgs += '--prerelease' }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
